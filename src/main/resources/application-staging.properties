# profile de homologacao (staging): mesmo comportamento de producao,
# mas com dados de exemplo e logs mais detalhados da aplicacao
info.app.ambiente=staging
logging.level.br.com.fiap.ecotrack=DEBUG
logging.file.name=/app/logs/ecotrack-staging.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
