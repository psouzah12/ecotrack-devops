spring.application.name=ecotrack-api
server.port=8080

# datasource Oracle - valores default funcionam quando rodando local fora do docker
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ECOTRACK}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ecotrack123}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA so valida o schema, quem cria as tabelas e o Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# datas no formato ISO ao inves de timestamp numerico
spring.jackson.serialization.write-dates-as-timestamps=false

# swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
