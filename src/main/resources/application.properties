spring.application.name=ecotrack-api
server.port=8080
# termina as requisições em andamento antes de desligar (deploy sem derrubar chamadas)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# datasource Oracle - valores default funcionam rodando local fora do docker
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ECOTRACK}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ecotrack123}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# JPA so valida o schema, quem cria as tabelas e o Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.open-in-view=false

# Flyway: db/migration tem o schema, db/seed os dados de exemplo.
# Em producao o profile prod tira o db/seed (banco comeca vazio).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/seed
spring.flyway.baseline-on-migrate=true

# datas no formato ISO ao inves de timestamp numerico
spring.jackson.serialization.write-dates-as-timestamps=false

# swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}

# usuarios da API (em staging/producao vem de variavel de ambiente)
ecotrack.security.admin.username=${ECOTRACK_ADMIN_USER:admin@ecotrack.com}
ecotrack.security.admin.password=${ECOTRACK_ADMIN_PASSWORD:admin123}
ecotrack.security.user.username=${ECOTRACK_USER:user@ecotrack.com}
ecotrack.security.user.password=${ECOTRACK_USER_PASSWORD:user123}

# actuator: health (liveness/readiness) e info sao publicos, o resto exige ADMIN
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-components=always
management.endpoint.health.show-details=when-authorized
management.endpoint.health.group.readiness.include=readinessState,db
management.info.env.enabled=true
management.info.java.enabled=true

# informacoes exibidas em /actuator/info e na pagina inicial
info.app.nome=EcoTrack API
info.app.descricao=Gestao de indicadores e acoes ESG
info.app.versao=@project.version@
info.app.ambiente=${APP_ENV:local}
info.app.commit=${APP_COMMIT:local}

logging.level.root=INFO
logging.level.br.com.fiap.ecotrack=INFO
